[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pafi"
version = "0.1.0"
description = "PAFI free-energy barrier calculations using ASE calculators"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Swinburne", email = "tomswinburne@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "ase",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://tomswinburne.github.io"
Repository = "https://github.com/tomswinburne/pafi"

[tool.setuptools.packages.find]
where = ["."]
include = ["pafi*"]
